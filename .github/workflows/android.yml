name: Android Build (Arm64 + NNAPI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release-apk"
        type: choice
        options:
          - debug
          - test-apk
          - release-apk
          - release-aab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        # android-actions/setup-android@v3 invokes `sdkmanager tools`, a package
        # that no longer exists in current SDK repositories (cmdline-tools 16.0),
        # so it fails on ubuntu-latest. The runner already ships the SDK; install
        # only what this project needs (compileSdk/targetSdk 36).
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36"

      - name: Setup NDK r28b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # Older cache entries may contain hard-linked, already-patched packages.
          key: ${{ runner.os }}-bun-copy-v1-${{ hashFiles('bun.lock', 'patches/**/*.patch') }}

      - name: Install dependencies
        # patch-package edits files in place; hardlinks would mutate Bun's cache.
        run: bun install --frozen-lockfile --backend=copyfile

      - name: Typecheck
        # Catches the 6 strict-mode errors fixed in this commit (AUD-02).
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Regression tests (picker, audio, queue, storage and model)
        run: bun run test

      - name: Check generated npm notices
        run: node scripts/generate-notices.cjs --check

      - name: Atomic replacement regression (actual Java implementation)
        run: |
          mkdir -p "$RUNNER_TEMP/dd-atomic"
          javac -d "$RUNNER_TEMP/dd-atomic" modules/AudioProcessorModule/android/src/main/java/expo/modules/audioprocessormodule/AtomicFileWriter.java tests/AtomicFileWriterTest.java
          java -cp "$RUNNER_TEMP/dd-atomic" AtomicFileWriterTest

      - name: Exact native PCM I/O regression (actual JVM implementation)
        run: |
          mkdir -p "$RUNNER_TEMP/dd-pcm"
          javac -d "$RUNNER_TEMP/dd-pcm" modules/AudioProcessorModule/android/src/main/java/expo/modules/audioprocessormodule/PcmIntegrity.java tests/PcmIntegrityTest.java
          java -cp "$RUNNER_TEMP/dd-pcm" PcmIntegrityTest

      - name: Non-overwriting promotion and trim-edge regression (actual Java implementation)
        run: bun run test:jvm-safety

      - name: Native incoming-share FIFO regression (actual JVM implementation)
        run: |
          mkdir -p "$RUNNER_TEMP/dd-share"
          javac -d "$RUNNER_TEMP/dd-share" node_modules/expo-sharing/android/src/main/java/expo/modules/sharing/ShareIntentQueue.java tests/ShareIntentQueueTest.java
          java -cp "$RUNNER_TEMP/dd-share" ShareIntentQueueTest

      - name: Real bundled model regression (CPU)
        run: |
          npm install --prefix "$RUNNER_TEMP/dd-ort" --ignore-scripts --no-save --no-package-lock onnxruntime-node@1.24.3
          NODE_PATH="$RUNNER_TEMP/dd-ort/node_modules" bun run test:real-model

      - name: Expo Prebuild (Android only)
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Tune Gradle memory
        # :app:packageRelease OOMs on Expo's default 2g heap when ZipFlinger
        # buffers the 13MB .ort model plus RN/ONNX native libs.
        # NOTE: expo prebuild writes gradle.properties WITHOUT a trailing
        # newline, so a plain `cat >>` glues the first line onto
        # `ndkVersion=...` and breaks NDK parsing (CXX1103). Rewrite the two
        # keys explicitly instead of appending.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          lines = [
              line for line in p.read_text().splitlines()
              if not line.startswith(("org.gradle.jvmargs=", "org.gradle.workers.max="))
          ]
          lines += [
              "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
              "org.gradle.workers.max=2",
          ]
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Determine build command
        id: build
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release-apk' }}"
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "gradle_task=:app:assembleDebug" >> $GITHUB_OUTPUT
            echo "artifact_pattern=**/*-debug.apk" >> $GITHUB_OUTPUT
          elif [ "$BUILD_TYPE" = "release-aab" ]; then
            echo "gradle_task=:app:bundleRelease" >> $GITHUB_OUTPUT
            echo "artifact_pattern=**/*.aab" >> $GITHUB_OUTPUT
          else
            echo "gradle_task=:app:assembleRelease" >> $GITHUB_OUTPUT
            echo "artifact_pattern=**/*-release.apk" >> $GITHUB_OUTPUT
          fi

      - name: Prepare signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
          RELEASE_REVIEWED: ${{ vars.ANDROID_RELEASE_REVIEWED }}
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ steps.build.outputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "test-apk" ]; then
            echo "mode=testing-debug-signed" >> "$GITHUB_OUTPUT"
            echo "DD_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD$EXPECTED_CERT" ]; then
            [ "$RELEASE_REVIEWED" = "true" ] || { echo "::error::Production signing is blocked until the owner completes docs/THIRD_PARTY_REVIEW.md and sets ANDROID_RELEASE_REVIEWED=true"; exit 1; }
            for VALUE in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$EXPECTED_CERT"; do
              [ -n "$VALUE" ] || { echo "::error::Release signing secrets are incomplete; see docs/RELEASE_SIGNING.md"; exit 1; }
            done
            KEYSTORE="$RUNNER_TEMP/deepdenoiser-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            [ -s "$KEYSTORE" ] || { echo "::error::Decoded keystore is empty"; exit 1; }
            chmod 600 "$KEYSTORE"
            echo "DD_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "mode=production-signed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No production signing key configured. This artifact is for testing only."
            echo "DD_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "mode=testing-debug-signed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android (Gradle)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ steps.build.outputs.gradle_task }} --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          DD_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DD_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DD_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify native picker and content-hash functions
        # Prebuilt Expo AARs can silently ignore local Kotlin patches. Verify
        # the actual binary for both APK and AAB workflow_dispatch builds.
        shell: bash
        run: |
          if [ "${{ steps.build.outputs.build_type }}" = "release-aab" ]; then
            BINARY=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
            PATTERN='base/dex/classes*.dex'
          else
            BINARY=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
            PATTERN='classes*.dex'
          fi
          test -n "$BINARY" || { echo "::error::No Android binary found"; exit 1; }
          TMP=$(mktemp -d)
          unzip -q "$BINARY" "$PATTERN" -d "$TMP"
          find "$TMP" -name '*.dex' -print0 | xargs -0 -r strings > "$TMP/dex-strings.txt"
          for SYMBOL in cancelPendingPick copyFileWithSha256 atomicReplaceFile exportMediaFile getContentDisplayName fingerprintFile isWriterActive hasRecordingError recordingFailed linkPrivateFileNoReplace DD_FS_SHORT_READ STOP_TIMEOUT getShareIntentGeneration acknowledgeShareIntent takeShareQueueOverflow ShareIntentQueue getDiagnosticsInfo readDiagnosticHistory writeDiagnosticHistory deleteDiagnosticHistory; do
            grep -Fq "$SYMBOL" "$TMP/dex-strings.txt" || { echo "::error::$SYMBOL missing from DEX"; exit 1; }
            echo "OK: $SYMBOL present in DEX"
          done

      - name: Verify artifact signing certificate
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ "${{ steps.build.outputs.build_type }}" = "release-aab" ]; then
            BINARY=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
            keytool -J-Duser.language=en -printcert -jarfile "$BINARY" > "$RUNNER_TEMP/cert.txt"
            ACTUAL=$(sed -n 's/.*SHA256: *//p' "$RUNNER_TEMP/cert.txt" | head -1)
          else
            BINARY=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs "$BINARY" > "$RUNNER_TEMP/cert.txt"
            ACTUAL=$(sed -n 's/.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/cert.txt" | head -1)
          fi
          [ -n "$ACTUAL" ] || { echo "::error::Could not read the artifact certificate"; exit 1; }
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "${{ steps.signing.outputs.mode }}" = "production-signed" ]; then
            if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/cert.txt"; then
              echo "::error::Production artifact uses a debug certificate"; exit 1
            fi
            NORMAL_ACTUAL=$(printf '%s' "$ACTUAL" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            NORMAL_EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            [ "$NORMAL_ACTUAL" = "$NORMAL_EXPECTED" ] || { echo "::error::Signing certificate fingerprint does not match ANDROID_CERT_SHA256"; exit 1; }
          fi

      - name: Locate artifacts
        id: locate
        run: |
          echo "Looking for artifacts..."
          find android -name "*.apk" -o -name "*.aab" | tee artifacts.txt
          if [ ! -s artifacts.txt ]; then
            echo "No APK/AAB found!"
            exit 1
          fi

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: deepdenoiser-${{ steps.signing.outputs.mode }}-${{ steps.build.outputs.build_type }}-arm64
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      # Maps contain bundled source and have the same access as this repository's
      # Actions artifacts. Never use these artifacts as a private secret store.
      - name: Prepare diagnostic symbols
        if: steps.build.outputs.build_type != 'debug'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dd-diagnostic-symbols"
          mkdir -p "$OUT"
          MAP=$(find android/app/build/generated/sourcemaps/react -name '*.map' -type f | head -1)
          test -n "$MAP" && test -s "$MAP" || { echo "::error::Release JS source map missing"; exit 1; }
          cp "$MAP" "$OUT/index.android.bundle.map"
          R8=android/app/build/outputs/mapping/release/mapping.txt
          test -s "$R8" || { echo "::error::Release R8 mapping missing"; exit 1; }
          cp "$R8" "$OUT/r8-mapping.txt"
          NATIVE=$(find android/app/build/outputs/native-debug-symbols -name '*.zip' -type f 2>/dev/null | head -1 || true)
          if [ -n "$NATIVE" ]; then cp "$NATIVE" "$OUT/native-debug-symbols.zip"; else echo 'Native debug symbols were not generated; vendor symbols may be unavailable.' > "$OUT/NATIVE-SYMBOLS-UNAVAILABLE.txt"; fi
          printf 'Commit: %s\nBuild type: %s\nSigning mode: %s\n' "$GITHUB_SHA" '${{ steps.build.outputs.build_type }}' '${{ steps.signing.outputs.mode }}' > "$OUT/BUILD.txt"
          (cd "$OUT" && sha256sum ./* > SHA256SUMS.txt)

      - name: Upload diagnostic symbols
        if: steps.build.outputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: deepdenoiser-diagnostic-symbols-${{ github.sha }}
          path: ${{ runner.temp }}/dd-diagnostic-symbols/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "### DeepDenoiser Arm64 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Build type: ${{ steps.build.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Target: arm64-v8a · minSdk 26 · NNAPI + XNNPACK" >> $GITHUB_STEP_SUMMARY
          echo "- Signing: ${{ steps.signing.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.signing.outputs.mode }}" = "testing-debug-signed" ]; then
            echo "- **Testing only**: debug-signed; do not distribute as a production release." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Artifacts uploaded." >> $GITHUB_STEP_SUMMARY
